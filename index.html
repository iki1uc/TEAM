<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TEAM – Build · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#0f0; letter-spacing:4px; margin-bottom:30px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; margin-top:10px; white-space:pre-wrap; }
a { color:#6cf; text-decoration:none; font-weight:bold; }
</style>

<script type="module">
import { HUB_AI } from "../HUB/HUB_AI.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";
import { NET_OVERDRIVE } from "../NET/NET_Overdrive.js";
import { TEAM_BUILD } from "./TE.js";

(async function () {

    /* -----------------------------------
       MODULES LADEN
    ----------------------------------- */
    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);
    const hub = HUB_AI(nc, pq, tmp);
    const net = NET_OVERDRIVE(nc, pq, tmp, hub);
    const respo = { mode: "active", signal: "bright" };

    /* -----------------------------------
       TEAM BUILD
    ----------------------------------- */
    const team = TEAM_BUILD(hub, nc, pq, tmp, net, respo);

    document.getElementById("team-build").innerText =
        JSON.stringify(team, null, 2);

    /* -----------------------------------
       TEAM STATUS
    ----------------------------------- */
    document.getElementById("team-status").innerText =
        `Status: ${team.status}\nStation: ${team.station}`;

    /* -----------------------------------
       TEAM NODES
    ----------------------------------- */
    document.getElementById("team-nodes").innerText =
        JSON.stringify(team.team, null, 2);

})();
</script>

</head>

<body>

<h1>TEAM – Build · iki1uc</h1>

<!-- TEAM BUILD -->
<div class="block">
    <div class="title">TEAM‑Build</div>
    <pre id="team-build"></pre>
</div>

<!-- TEAM STATUS -->
<div class="block">
    <div class="title">TEAM‑Status</div>
    <pre id="team-status"></pre>
</div>

<!-- TEAM NODES -->
<div class="block">
    <div class="title">TEAM‑Nodes</div>
    <pre id="team-nodes"></pre>
</div>

</body>
</html>
