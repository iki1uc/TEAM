<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TEAM – Runtime · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">
import { HUB_AI } from "../HUB/HUB_AI.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";
import { NET_OVERDRIVE } from "../NET/NET_Overdrive.js";
import { TEAM_BUILD } from "./TE.js";

import { TEAM_DASHBOARD } from "./TEAM_Dashboard.js";
import { TEAM_AI_CORE } from "./TEAM_AI_Core.js";
import { TEAM_RUNTIME_MONITOR } from "./TEAM_Runtime_Monitor.js";
import { TEAM_FUSION_SPHERE } from "./TEAM_Fusion_Sphere.js";
import { TEAM_HUB_MATRIX } from "./TEAM_HUB_Matrix.js";
import { TEAM_NC_QUANTUM_NODES } from "./TEAM_NC_Quantum_Nodes.js";

(async function () {

    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);
    const hub = HUB_AI(nc, pq, tmp);
    const net = NET_OVERDRIVE(nc, pq, tmp, hub);
    const respo = { mode: "active", signal: "bright" };

    const team = TEAM_BUILD(hub, nc, pq, tmp, net, respo);

    document.getElementById("dashboard").innerText =
        JSON.stringify(TEAM_DASHBOARD(team), null, 2);

    document.getElementById("ai-core").innerText =
        JSON.stringify(TEAM_AI_CORE(team), null, 2);

    document.getElementById("runtime").innerText =
        JSON.stringify(TEAM_RUNTIME_MONITOR(team), null, 2);

    document.getElementById("fusion").innerText =
        JSON.stringify(TEAM_FUSION_SPHERE(team), null, 2);

    document.getElementById("hub-matrix").innerText =
        JSON.stringify(TEAM_HUB_MATRIX(team), null, 2);

    document.getElementById("nc-nodes").innerText =
        JSON.stringify(TEAM_NC_QUANTUM_NODES(team), null, 2);

})();
</script>

</head>

<body>

<h1>TEAM – Runtime · iki1uc</h1>

<div class="block">
    <div class="title">TEAM‑Dashboard</div>
    <pre id="dashboard"></pre>
</div>

<div class="block">
    <div class="title">TEAM‑AI‑Core</div>
    <pre id="ai-core"></pre>
</div>

<div class="block">
    <div class="title">TEAM‑Runtime‑Monitor</div>
    <pre id="runtime"></pre>
</div>

<div class="block">

    <pre id="fusion"></pre>
</div>

<div class="block">
    <div class="title">TEAM‑HUB‑Matrix</div>
    <pre id="hub-matrix"></pre>
</div>

<div class="block">
    <div class="title">TEAM‑NC‑Quantum‑Nodes</div>
    <pre id="nc-nodes"></pre>
</div>

</body>
</html>
